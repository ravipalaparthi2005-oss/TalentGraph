server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: talentgraph-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/talentgraph}
    username: ${DATABASE_USERNAME:talentgraph}
    password: ${DATABASE_PASSWORD:talentgraph}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# AI Provider Configuration — OpenRouter
# Uses @ConfigurationProperties(prefix = "openrouter") in OpenRouterProperties
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  model: ${OPENROUTER_MODEL:openrouter/free}
  timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:60}
  max-response-chars: 32000
  analysis-enabled: ${AI_RESUME_ANALYSIS_ENABLED:true}

# External API Placeholders
github:
  token: ${GITHUB_TOKEN:}

judge0:
  api-url: ${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
  api-key: ${JUDGE0_API_KEY:}

