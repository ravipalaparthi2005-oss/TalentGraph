spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-test-google-client-id
            client-secret: dummy-test-google-client-secret
            scope:
              - email
              - profile
  datasource:
    url: jdbc:h2:mem:talentgraph;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
