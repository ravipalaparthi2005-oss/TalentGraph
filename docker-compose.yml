services:
  postgres:
    image: postgres:16-alpine
    container_name: talentgraph-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentgraph}
      POSTGRES_USER: ${POSTGRES_USER:-talentgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentgraph}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentgraph} -d ${POSTGRES_DB:-talentgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: talentgraph-postgres-data
